name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: logservice
          POSTGRES_PASSWORD: local-development
          POSTGRES_DB: logservice
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U logservice -d logservice"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: make install
      - run: make check
      - run: make integration
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose exec -T api python -m scripts.smoke
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
